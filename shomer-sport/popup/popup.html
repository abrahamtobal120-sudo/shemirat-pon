<!doctype html>
<html lang="es" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Shomer Sport</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="34" height="34">
    <div class="brand">
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <div class="lang" role="radiogroup" id="langGroup">
      <label><input type="radio" name="lang" value="es"><span>ES</span></label>
      <label><input type="radio" name="lang" value="en"><span>EN</span></label>
      <label><input type="radio" name="lang" value="he"><span>עב</span></label>
    </div>
  </header>

  <!-- Estado de la pestaña actual -->
  <section class="status" id="statusBox" data-state="none" aria-live="polite">
    <div class="status-line">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText">…</span>
    </div>
    <div class="chips" id="statusChips"></div>
    <ul class="warnings" id="statusWarnings"></ul>
  </section>

  <section class="card search" id="sportSearch">
    <h2>🔎 ¿Qué deporte quieres ver?</h2>
    <form class="row" id="sportForm">
      <input id="sportInput" type="search" placeholder="Ej.: fútbol, NFL, box…" autocomplete="off">
      <button type="submit">Ver</button>
    </form>
    <div class="quick" id="sportQuick"></div>
    <p class="hint">Se abre sola la primera transmisión en vivo de un canal oficial de YouTube.</p>
  </section>

  <!-- Bloqueo por PIN -->
  <section id="lockBox" class="card lock" hidden>
    <p class="lock-title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>
      <span data-i18n="pinEnter"></span>
    </p>
    <div class="row">
      <input id="unlockPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      <button id="unlockBtn" data-i18n="pinUnlock"></button>
    </div>
    <p id="unlockMsg" class="msg"></p>
  </section>

  <main id="controls">
    <section class="card hero" id="hero">
      <label class="switch-row">
        <span class="shield" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4z"/></svg>
        </span>
        <span class="hero-text">
          <strong id="heroTitle"></strong>
          <small data-i18n="heroSub"></small>
        </span>
        <input type="checkbox" id="enabled" class="switch">
      </label>
    </section>

    <div id="settingsBody">
      <section class="card">
        <h2 data-i18n="level"></h2>
        <div class="options" role="radiogroup">
          <label class="option">
            <input type="radio" name="level" value="normal">
            <span><b data-i18n="levelNormal"></b><small data-i18n="levelNormalHint"></small></span>
          </label>
          <label class="option">
            <input type="radio" name="level" value="strict">
            <span><b data-i18n="levelStrict"></b><small data-i18n="levelStrictHint"></small></span>
          </label>
        </div>

        <h2 data-i18n="cover"></h2>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="cover" value="blur"><span><i class="sw sw-blur" aria-hidden="true"></i><span data-i18n="coverBlur"></span></span></label>
          <label><input type="radio" name="cover" value="solid"><span><i class="sw sw-solid" aria-hidden="true"></i><span data-i18n="coverSolid"></span></span></label>
        </div>

        <div class="slider-head">
          <h2 data-i18n="delay"></h2>
          <output id="delayOut" class="badge"></output>
        </div>
        <input type="range" id="delaySec" min="1" max="3" step="0.5">
        <div class="ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span></div>
        <p class="hint" data-i18n="delayHint"></p>
      </section>

      <section class="card">
        <h2 data-i18n="sectionExtras"></h2>
        <label class="switch-row">
          <span class="lbl"><span data-i18n="adBlock"></span><small data-i18n="adBlockHint"></small></span>
          <input type="checkbox" id="adBlock" class="switch">
        </label>
        <label class="switch-row">
          <span class="lbl"><span data-i18n="muteOnFilter"></span><small data-i18n="muteOnFilterHint"></small></span>
          <input type="checkbox" id="muteOnFilter" class="switch">
        </label>
      </section>
    </div>

    <section class="card">
      <h2 data-i18n="pinSection"></h2>
      <p class="hint pin-state" id="pinState"></p>
      <div class="row">
        <input id="newPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
        <button id="setPinBtn"></button>
      </div>
      <div class="row links">
        <button id="lockNowBtn" class="link" data-i18n="pinLockNow" hidden></button>
        <button id="removePinBtn" class="link danger" data-i18n="pinRemove" hidden></button>
      </div>
      <p id="pinMsg" class="msg"></p>
    </section>
    <section class="card">
      <a class="guide-link" href="../guide/guide.html" target="_blank">📺 Dónde ver partidos gratis</a>
    </section>
  </main>

  <footer data-i18n="footer"></footer>
  <script src="../common/i18n.js"></script>
  <script src="../common/settings.js"></script>
  <script src="../common/sports.js"></script>
  <script src="popup.js"></script>
</body>
</html>
