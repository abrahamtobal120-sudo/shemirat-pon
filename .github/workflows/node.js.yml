name: Web CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Test installation guide
      run: node --test "web lading/guide.test.js"
    - name: Test Safari preparation
      run: python3 -m unittest discover -s shomer-safari -p 'test_*.py'
    - name: Build landing page and verify download
      run: |
        python3 "web lading/build.py"
        python3 -m zipfile -t "web lading/public/downloads/shomer-web.zip"
