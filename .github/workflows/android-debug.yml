name: Android prototype APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/mobile-install-guides
    paths:
      - 'shomer-android/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'shomer-android/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug prototype
        working-directory: shomer-android
        run: gradle :app:assembleDebug
      - name: Record APK checksum
        working-directory: shomer-android/app/build/outputs/apk/debug
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app-debug.apk
          sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shomer-android-prototipo-debug
          path: |
            shomer-android/app/build/outputs/apk/debug/app-debug.apk
            shomer-android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
